name: Storefront CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'apps/storefront/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - '.github/workflows/storefront.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'apps/storefront/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - '.github/workflows/storefront.yml'

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront-quality:
    name: Storefront Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-storefront-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-storefront-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, package-check and build storefront via Turbo
        run: |
          pnpm exec turbo run lint --filter=@minieshop/storefront...
          pnpm exec turbo run typecheck --filter=@minieshop/storefront...
          pnpm exec turbo run test --filter=@minieshop/storefront...
          pnpm exec turbo run build --filter=@minieshop/storefront...
          pnpm --filter @minieshop/contracts lint:pkg

      - name: Dependency audit gate (blocking on high/critical)
        run: pnpm audit --audit-level=high
